apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp252-api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: mp252-api
  template:
    metadata:
      labels:
        app: mp252-api
    spec:
      containers:
        - name: api
          image: mp252-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
